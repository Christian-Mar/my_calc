[project]
name = "my-calc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian", email = "71664957+Christian-Mar@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
my-calc = "my_calc:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88               # the Black-compatible default

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade: modernise outdated syntax
    "B",   # flake8-bugbear: likely bugs
]